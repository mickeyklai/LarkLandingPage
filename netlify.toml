[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

# ----------------------------------------------------------------------------
# Edge functions
# ----------------------------------------------------------------------------
# Israel → /he/* ; other countries → English paths (no language switcher)
[[edge_functions]]
  path = "/*"
  function = "geo-locale"

# /blog/{slug}: server-side OG / Twitter / Article JSON-LD / Breadcrumb / canonical injection
[[edge_functions]]
  path = "/blog/*"
  function = "inject-blog-og"

# ----------------------------------------------------------------------------
# Locale-prefixed URLs (Hebrew only — geo routing sends Israel here)
# Add locales in i18n/locales.json, then: node scripts/sync-locale-config.cjs
# LOCALE_REDIRECTS_START
# Generated by scripts/sync-locale-config.cjs — edit i18n/locales.json instead

[[redirects]]
  from = "/he"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/he/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/he/blog"
  to = "/he/"
  status = 302

[[redirects]]
  from = "/he/blog/"
  to = "/he/"
  status = 302

[[redirects]]
  from = "/he/blog/*"
  to = "/he/"
  status = 302

[[redirects]]
  from = "/he/privacy-policy.html"
  to = "/privacy-policy.html"
  status = 200

# LOCALE_REDIRECTS_END

# ----------------------------------------------------------------------------
# SEO endpoints (Sanity-backed, dynamic)
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/rss.xml"
  to = "/.netlify/functions/feed"
  status = 200

# ----------------------------------------------------------------------------
# Pretty URLs: /blog/my-post serves post.html; slug is read client-side from the path.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/blog/*"
  to = "/blog/post.html"
  status = 200

# ----------------------------------------------------------------------------
# robots.txt + sitemap headers
# ----------------------------------------------------------------------------
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300"
